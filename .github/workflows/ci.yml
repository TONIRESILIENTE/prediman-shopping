# .github/workflows/ci.yml
# ─────────────────────────────────────────────
# CONCEITO: CI (Continuous Integration).
# Toda vez que um commit é enviado para o GitHub,
# este workflow roda automaticamente os testes.
# Se algum teste falhar, o commit é marcado como ❌.
# ─────────────────────────────────────────────

name: Testes

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: prediman_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: prediman_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout código
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Instalar dependências
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Rodar testes
      env:
        DATABASE_URL: postgresql://prediman_user:test_password@localhost:5432/prediman_test
        SECRET_KEY: chave-teste-ci
      run: |
        python -m pytest tests/ -v --tb=short